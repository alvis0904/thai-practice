<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>泰文邏輯練習</title>
<meta name="theme-color" content="#2F6FDB">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="泰文練習">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Noto Sans Thai Looped';font-weight:400;font-display:swap;src:url(fonts/noto-sans-thai-looped-thai-400-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Thai Looped';font-weight:600;font-display:swap;src:url(fonts/noto-sans-thai-looped-thai-600-normal.woff2) format('woff2')}
@font-face{font-family:'Noto Sans Thai Looped';font-weight:700;font-display:swap;src:url(fonts/noto-sans-thai-looped-thai-700-normal.woff2) format('woff2')}
@font-face{font-family:'Kanit';font-weight:500;font-display:swap;src:url(fonts/kanit-thai-500-normal.woff2) format('woff2')}
/* Layout: one narrow phone column, one task per screen, thumb-reach buttons at the bottom */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --line:#E6E0D6; --fg:#2B2B2B; --muted:#5E5A55; --soft:#EDE7DD;
  --mid:#2F6FDB; --high:#C2541A; --high-bar:#E8743B; --low:#6B4FBB; --vowel:#6B6B6B; --tone:#D6336C;
  --ok:#2E9E6A; --ok-bg:#E3F4EB; --warn:#D99A1E; --warn-bg:#FFF4DE; --warn-fg:#5A3E00; --on-accent:#FFFFFF;
  --font-ui:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --font-th:'Noto Sans Thai Looped',Tahoma,sans-serif;
  --font-sign:'Kanit',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1B1F; --surface:#26252A; --line:#3A3840; --fg:#ECE8E1; --muted:#A8A39B; --soft:#33313A;
  --mid:#7EA6F2; --high:#F0915C; --high-bar:#F0915C; --low:#B19DF0; --vowel:#B4B4B4; --tone:#F27AA3;
  --ok:#4CC28C; --ok-bg:#1E3A2C; --warn:#E8B04A; --warn-bg:#3A2F1A; --warn-fg:#F2D49A; --on-accent:#10131A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1B1F; --surface:#26252A; --line:#3A3840; --fg:#ECE8E1; --muted:#A8A39B; --soft:#33313A;
  --mid:#7EA6F2; --high:#F0915C; --high-bar:#F0915C; --low:#B19DF0; --vowel:#B4B4B4; --tone:#F27AA3;
  --ok:#4CC28C; --ok-bg:#1E3A2C; --warn:#E8B04A; --warn-bg:#3A2F1A; --warn-fg:#F2D49A; --on-accent:#10131A; color-scheme:dark}
/* 夜間模式：暖色暗底，降低藍光；類別顏色對應不變 */
body.night{
  --bg:#1D1915; --surface:#28221C; --line:#3E352B; --fg:#ECE2D4; --muted:#AC9F8E; --soft:#3A3129;
  --mid:#86A9EC; --high:#F09A66; --high-bar:#F09A66; --low:#B8A4EC; --vowel:#B8AEA2; --tone:#F084A8;
  --ok:#5DBB8C; --ok-bg:#20332A; --warn:#E3AE52; --warn-bg:#3A2E1B; --warn-fg:#F2D49A; --on-accent:#1A140F; color-scheme:dark}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:480px;margin:0 auto;padding-block:20px 32px;min-height:100%;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.th{font-family:var(--font-th)} .sign{font-family:var(--font-sign)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pill{font-family:inherit;font-size:13px;font-weight:500;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;white-space:nowrap;min-height:36px}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip{display:inline-block;font-size:12px;font-weight:700;color:var(--on-accent);border-radius:999px;padding:3px 10px}
.c-mid{color:var(--mid)} .c-high{color:var(--high)} .c-low{color:var(--low)} .c-vowel{color:var(--vowel)} .c-tone{color:var(--tone)}
.bg-mid{background:var(--mid)} .bg-high{background:var(--high)} .bg-low{background:var(--low)} .bg-vowel{background:var(--vowel)}
.bar-mid{border-top:6px solid var(--mid)} .bar-high{border-top:6px solid var(--high-bar)} .bar-low{border-top:6px solid var(--low)} .bar-vowel{border-top:6px solid var(--vowel)}
button{font-family:inherit;font-size:16px;cursor:pointer;color:var(--fg)}
button:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.btn{min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 16px}
.btn.primary{background:var(--mid);border-color:var(--mid);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.spacer{flex:1}
.linkbtn{background:none;border:none;color:var(--mid);font-size:14px;font-weight:500;padding:8px 0;min-height:44px}
.big{font-family:var(--font-th);font-size:96px;line-height:1.25;font-weight:600;text-align:center}
.mid-big{font-family:var(--font-th);font-size:56px;line-height:1.3;font-weight:600;text-align:center}
.qhead{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .t{font-family:var(--font-th);font-size:30px;font-weight:600;line-height:1.3}
.opt .s{font-size:13px;color:var(--muted)}
.opt.sel{border-color:var(--mid)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--ok-bg)} .fb.bad{background:var(--warn-bg)}
.fb.bad .ttl{color:var(--warn-fg)}
.fb .ttl{font-weight:700;font-size:16px}
.audio{width:48px;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.audio.lg{width:72px;height:72px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.step .n{width:26px;height:26px;border-radius:999px;background:var(--soft);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.step.ok .n{background:var(--ok);color:var(--on-accent)} .step.no{background:var(--warn-bg);border-color:var(--warn)} .step.no .n{background:var(--warn);color:#2B2B2B}
.step .v{margin-left:auto;font-weight:700;text-align:right}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;align-content:flex-start}
.answer{border:2px dashed var(--line);border-radius:16px;padding:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;min-height:52px;justify-content:center}
.tile .t{font-family:var(--font-th);font-size:22px;font-weight:600;line-height:1.3}
.tile .s{font-size:11.5px;color:var(--muted)}
.tile.used{visibility:hidden}
.meter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mini .t{font-family:var(--font-th);font-size:26px;font-weight:600;line-height:1.2}
.path{display:flex;flex-direction:column;gap:8px}
.stage{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.stage .dot{width:12px;height:12px;border-radius:999px;background:var(--soft);flex:none}
.stage.done .dot{background:var(--ok)} .stage.cur .dot{background:var(--mid)}
.stage.lock{opacity:.55}
.stage .grow{flex:1;min-width:120px}
.tonecurve{vertical-align:middle}
.mapgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lt{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px 2px}
.lt .lp{font-family:var(--font-th);font-size:32px;font-weight:600;line-height:1.25}
.lt .sg{font-family:var(--font-sign);font-size:15px;font-weight:600;color:var(--muted);line-height:1.2}
.lt small{font-size:11.5px;font-weight:500;color:var(--muted)}
.lt.rare{opacity:.5;border-style:dashed}
.lt.sel{border:2px solid var(--fg)}
.place{display:flex;align-items:baseline;gap:8px}
.vrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:24px}
.duo .lbl{font-size:12px;color:var(--muted);text-align:center}
.signbox{font-family:var(--font-sign);font-weight:600}
.stagechips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
canvas.trace{width:100%;max-width:320px;aspect-ratio:1;align-self:center;border:1px solid var(--line);border-radius:16px;background:var(--surface);touch-action:none}
.note{background:var(--warn-bg);color:var(--warn-fg);border-radius:14px;padding:12px 14px;font-size:14px}
.hide-roman{filter:blur(4px)}
.sign{font-family:var(--font-sign)!important;font-weight:500!important}
.memo{display:flex;align-items:center;gap:12px}
.emo{font-size:40px;line-height:1;flex:none}
.exrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.exrow .grow,.grow{flex:1;min-width:0}
.recall{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;min-height:64px}
.recall .t{font-family:var(--font-th);font-size:30px;font-weight:600;min-width:72px;text-align:center}
.recall .ans{flex:1;min-width:0}
table.rules{border-collapse:collapse;width:100%;font-size:14px}
table.rules td,table.rules th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
'use strict';
const APP_VERSION = '1.2.0';

const TM = {'':'無符號','่':'่ ไม้เอก','้':'้ ไม้โท','๊':'๊ ไม้ตรี','๋':'๋ ไม้จัตวา'};
const TONES = {

const CLS = {mid:'中子音',high:'高子音',low:'低子音'};

const MEMO = {

 'ว':['แหวน','wɛ̌ɛn','戒指','💍'],'ฬ':['กีฬา','gii-laa','運動（ฬ 在字中）','⚽'],'ฮ':['นกฮูก','nók-hûuk','貓頭鷹','🦉']

const LOW_B = ['ง','น','ม','ย','ร','ล','ว'], LOW_B_RARE = ['ญ','ณ','ฬ'];

const PLACE = [
 ['嘴唇','ㄅㄆㄇㄈ',['b','bp','p','f','m','w']],
 ['舌尖','ㄉㄊㄋㄌㄙ',['d','dt','t','n','l','r','s']],

function makeSyl(c,v,t){
  const th = v.tpl.replace('C',c.ch).replace('T',t||'');
  const live = v.len!=='S';
  let tone;
  if(c.cls==='mid') tone = !t?(live?'M':'L'):({'่':'L','้':'F','๊':'H','๋':'R'})[t];
  else if(c.cls==='high') tone = !t?(live?'R':'L'):({'่':'L','้':'F'})[t];
  else tone = !t?(live?'M':(v.len==='L'?'F':'H')):({'่':'F','้':'H'})[t];
  const roman = c.r + v.r.charAt(0) + TONES[tone].d + v.r.slice(1);
  return {th,cls:c.cls,kind:live?'L':'DS',mark:t||'',tone,r:roman.normalize('NFC'),c,v,practice:true};
}
function toneMarksFor(c,v){ if(v.len==='S') return ['']; return c.cls==='mid'?['','่','้','๊','๋']:['','่','้']; }
function explainRule(w){
  const cl=CLS[w.cls], rule=RULES[ruleOf(w.cls,w.kind,w.mark)];
  return `<span class="c-${w.cls}">${cl}</span> → ${KIND[w.kind]} → ${w.mark?'符號 <span class="c-tone">'+TM[w.mark]+'</span>':'無符號'} → <b>${TONES[w.tone].n}</b>（${TONES[w.tone].hint}）<br><span class="small muted">規則：${rule?rule.t:''}</span>`;
}

const pick = a => a[rnd(a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniqBy = (a,f) => { const s=new Set(); return a.filter(x=>{const k=f(x); if(s.has(k)) return false; s.add(k); return true;}); };
function dayKey(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function addDays(k,n){ const [y,m,d]=k.split('-').map(Number); return dayKey(new Date(y,m-1,d+n)); }
function diffDays(a,b){ const p=k=>{const [y,m,d]=k.split('-').map(Number); return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); }
const curve = tone => {
  const d = {M:'M3 9 L25 9',L:'M3 12 L25 14',F:'M3 6 Q14 2 25 16',H:'M3 10 Q14 9 25 3',R:'M3 11 Q12 16 16 12 T25 3'}[tone];
  return `<svg class="tonecurve" width="28" height="18" viewBox="0 0 28 18" role="img" aria-label="${TONES[tone].n}"><path d="${d}" fill="none" stroke="var(--tone)" stroke-width="2.5" stroke-linecap="round"/></svg>`;
};
const SPK = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;
const hourNow = () => new Date().getHours();
const isEvening = () => { const h=hourNow(); return h>=17 || h<4; };

/* ---------- 語音 ---------- */
let thaiVoice = null;
const TTS_OK = typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined';
let lastSpeakErr = '';
function loadVoice(){ try{ const vs = speechSynthesis.getVoices(); thaiVoice = vs.find(v=>/^th/i.test(v.lang)) || null; }catch(e){} }
try{ if(TTS_OK){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; } }catch(e){}
function say(text,rate){
  if(!text) return;
  if(!TTS_OK){ lastSpeakErr='unsupported'; showTtsBanner(); return; }
  try{
    loadVoice();
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='th-TH'; if(thaiVoice) u.voice=thaiVoice;
    u.rate = rate || (S.settings.rate||0.8) * (nightActive()?0.9:1);
    u.onerror = e => { lastSpeakErr = e.error||'error'; showTtsBanner(); };
    u.onstart = () => { lastSpeakErr=''; };
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ lastSpeakErr='error'; showTtsBanner(); } },60);
    if(!thaiVoice){ setTimeout(()=>{ if(!speechSynthesis.speaking){ lastSpeakErr = lastSpeakErr||'novoice'; showTtsBanner(); } },1500); }
  }catch(e){ lastSpeakErr='error'; showTtsBanner(); }
}
function ttsHelp(){
  if(!TTS_OK || lastSpeakErr==='unsupported') return '這個瀏覽器不支援語音。請用手機的 <b>Chrome</b> 開啟並安裝這個 App。';
  if(!thaiVoice || lastSpeakErr==='novoice' || lastSpeakErr==='language-unavailable' || lastSpeakErr==='voice-unavailable') return '找不到泰文語音。Android：設定 → 系統 → 語言 → 文字轉語音輸出 → 偏好的引擎選「Google 語音服務」→ 下載「泰文」語音資料，然後重新開啟這個頁面。另外請確認媒體音量有開。';
  return '播放失敗（'+esc(lastSpeakErr)+'）。請確認媒體音量有開，再試一次。';
}
function showTtsBanner(){
  let b=document.getElementById('ttsb');
  if(!b){ b=document.createElement('div'); b.id='ttsb'; b.className='note'; b.setAttribute('role','status'); $app.prepend(b); }
  b.innerHTML = '<b>聽不到聲音？</b><br>'+ttsHelp();
}
const consSound = c => c.ch+'อ '+c.name;       // 念完整字母名稱，例如「ตอ เต่า」
const quiet = () => !!S.settings.quiet;
function itemSound(it){
  if(!it) return '';
  if(it.kind==='c') return consSound(it);
  if(it.kind==='v') return vSay(it);
  if(it.kind==='w') return it.th==='Alvis'?'':it.th;
  if(it.kind==='f') return it.ex[0];
  if(it.kind==='p') return it.a[0];
  return '';
}

/* =========================================================
   4. 進度保存（手機本機＋匯出備份）
   ========================================================= */
const S0 = () => ({v:3,items:{},stages:{},days:{},errors:[],skipped:[],settings:{rate:0.8,night:'auto',quiet:false},onboarded:false});
function normalize(x){
  if(!x || typeof x!=='object') return S0();
  const s = Object.assign(S0(), JSON.parse(JSON.stringify(x)));
  if((x.v||1)<2){
    const old = x.stages||{}, ns={};
    const cp=(o,n)=>{ if(old[o]) ns[n]=Object.assign(ns[n]||{},{passed:!!old[o].passed,introSeen:!!old[o].introSeen,mapSeen:!!old[o].passed,best:old[o].best||0}); };
    cp('S1','S1'); cp('S2','S2'); cp('S5','S3'); cp('S5','S4'); cp('S3','S5'); cp('S4','S6'); ['C1','C2','C3'].forEach(k=>cp(k,k));
    s.stages = ns;
    const nd={};
    Object.entries(x.days||{}).forEach(([k,d])=>{ const sec=d&&d.sec?Object.values(d.sec).reduce((a,b)=>a+b,0):0; nd[k]={night:sec,test:0}; });
    s.days = nd;
    Object.values(s.items).forEach(it=>{ if(it.seen>0 && !it.introDay) it.introDay='2000-01-01'; });
  }
  if((x.v||1)<3){
    // v1.2：字母卡改版，字母地圖要重新看一次；舊的「聲調規則」項目不再使用
    ['S1','S2','S3','S4','S5','S6'].forEach(k=>{ if(s.stages[k]) s.stages[k].mapSeen=false; });
    delete s.items['r:tone'];
  }
  s.v = 3;
  s.settings = Object.assign({rate:0.8,night:'auto',quiet:false}, s.settings||{});
  s.skipped = Array.isArray(s.skipped)?s.skipped.filter(id=>id!=='r:tone'):[];
  return s;
}
let S = S0();
function loadLocal(){ try{ const t=localStorage.getItem('thai-app-state'); if(t) return JSON.parse(t); }catch(e){} return null; }
let storageOk = true;
function save(){ try{ localStorage.setItem('thai-app-state',JSON.stringify(S)); storageOk=true; }catch(e){ storageOk=false; } }
function exportProgress(){
  const blob = new Blob([JSON.stringify(S)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'thai-progress-'+dayKey()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  S.lastBackup = dayKey(); touch();
}
function importProgress(obj){
  if(!obj || typeof obj!=='object' || !obj.items) throw new Error('bad');
  S = normalize(obj); S.onboarded = true; S.freshStart = dayKey(); touch();
}
async function fetchSeed(){ try{ const r = await fetch('progress-seed.json',{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
function touch(){ S.updatedAt = Date.now(); save(); }

/* =========================================================
   5. 熟練度、複習、每日紀錄
   ========================================================= */
const LV = ['新','學習中','熟悉','精熟'];
const INTERVAL = [1,3,7,14,30];
function st(id){ return S.items[id] || (S.items[id]={l:0,step:0,due:null,okDays:[],okTypes:[],lastOk:null,seen:0,wrong:0,introDay:null}); }
function lvl(id){ return S.items[id]?S.items[id].l:0; }
function isIntro(id){ return !!(S.items[id] && S.items[id].seen>0); }
function dayRec(k=dayKey()){
  const d = S.days[k] || (S.days[k]={});
  return Object.assign(d, Object.assign({night:0,test:0,rounds:0,newIds:[],relearnIds:[],testWrong:[],tested:[],relearnDone:false,recallDone:false,testDone:false,testRight:0,testTotal:0}, d));
}
const CAT = {class:'子音類別記錯',length:'長短音',tone:'聲調推算',shape:'形近字',sound:'聽辨',order:'句子順序',vocab:'單字意思',read:'認讀',sign:'招牌字體',final:'尾音',tonehear:'聽聲調'};
function record(id,ok,qtype,cat){
  if(!ITEM[id]) return;
  const s = st(id), today=dayKey(), d=dayRec();
  s.seen = Math.max(1, s.seen+1);
  if(!s.introDay) s.introDay = today;
  S.skipped = S.skipped.filter(x=>x!==id);
  if(run && run.phase==='test' && !d.tested.includes(id)) d.tested.push(id);
  if(ok){
    if(!s.okDays.includes(today)) s.okDays.push(today);
    if(s.okDays.length>8) s.okDays=s.okDays.slice(-8);
    if(!s.okTypes.includes(qtype)) s.okTypes.push(qtype);
    if(s.l===0) s.l=1;
    else if(s.l===1 && s.okDays.length>=2 && s.okTypes.length>=2) s.l=2;
    else if(s.l===2 && s.lastOk && diffDays(s.lastOk,today)>=7 && ['reason','listen','pair','drill','sign','spell','final'].includes(qtype)) s.l=3;
    if(s.due===null || s.due<=today){ s.step=Math.min(s.step+1,INTERVAL.length); }
    s.due = addDays(today, INTERVAL[Math.max(0,s.step-1)]);
    s.lastOk = today;
  } else {
    s.wrong++; s.l=Math.max(s.l>0?1:0,s.l-1); s.step=0; s.due=today;
    if(run && run.phase==='test' && !d.testWrong.includes(id)) d.testWrong.push(id);
    if(cat){ S.errors.push({d:today,cat,id}); if(S.errors.length>400) S.errors=S.errors.slice(-400); }
  }
}
function activeDay(k){ const d=S.days[k]; return !!d && ((d.night||0)>=60 || d.testDone); }
function streak(){ let n=0,k=dayKey(); if(!activeDay(k)) k=addDays(k,-1); while(activeDay(k)){ n++; k=addDays(k,-1);} return n; }
function lastStudyNight(){ const t=dayKey(); return Object.keys(S.days).filter(k=>k<t && (S.days[k].night||0)>=60).sort().pop()||null; }
function reviewOnlyTonight(){ if(S.freshStart===dayKey()) return false; const ln=lastStudyNight(); return !!ln && ln<addDays(dayKey(),-1) && learnedIds().length>0 && (dayRec().night||0)<60*25; }

function stageItems(id){ return SMAP[id].items(); }
const stagePassed = passed;
function sx(id){ return S.stages[id] || (S.stages[id]={}); }
function stageOpen(id){
  const s=SMAP[id];
  if(s.req) return s.req() || stagePassed(id);
  const list=STAGES.filter(x=>x.line===s.line); const i=list.indexOf(s);
  return i===0 || stagePassed(id) || stagePassed(list[i-1].id);
}
function lockText(s){
  if(s.reqTxt) return s.reqTxt;
  const list=STAGES.filter(x=>x.line===s.line); const i=list.indexOf(s);
  return i>0?`「${list[i-1].name}」過關後開放`:'';
}
function openStages(line){ return STAGES.filter(s=>(!line||s.line===line) && stageOpen(s.id)); }
function currentStage(line){ return STAGES.find(s=>s.line===line && stageOpen(s.id) && !stagePassed(s.id)) || null; }
function nextStages(id){ return STAGES.filter(s=>s.id!==id && !stagePassed(s.id) && stageOpen(s.id)); }
function testReady(id){ return stageItems(id).filter(i=>ITEM[i] && ITEM[i].th!=='Alvis').every(i=>lvl(i)>=2); }
function learnedIds(filter){ return Object.keys(S.items).filter(id=>ITEM[id] && S.items[id].l>=1 && (!filter||filter(ITEM[id]))); }
function dueIds(){ const t=dayKey(); return Object.keys(S.items).filter(id=>ITEM[id] && S.items[id].l>=1 && S.items[id].due && S.items[id].due<=t); }
function newQueue(line){ const out=[]; openStages(line).forEach(s=>stageItems(s.id).forEach(id=>{ if(!isIntro(id)) out.push(id); })); return out; }
function learnedCons(){ return CONS.filter(c=>lvl(c.id)>=1); }
function learnedVowels(){ return VOWELS.filter(v=>lvl(v.id)>=1); }
function availVowels(){ return uniqBy(learnedVowels().concat(CARRIER.map(id=>VMAP[id])),v=>v.id); }
function weakest(){
  const since = addDays(dayKey(),-7), cnt={};
  S.errors.filter(e=>e.d>=since && ITEM[e.id]).forEach(e=>{cnt[e.cat]=(cnt[e.cat]||0)+1;});
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(!top) return null;
  const ids={}; S.errors.filter(e=>e.d>=since && e.cat===top[0] && ITEM[e.id]).forEach(e=>{ids[e.id]=(ids[e.id]||0)+1;});
  return {cat:CAT[top[0]]||top[0],n:top[1],ids:Object.entries(ids).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>label(x[0]))};
}
function label(id){
  const it=ITEM[id]; if(!it) return '';
  if(it.kind==='c') return it.ch; if(it.kind==='v') return vForm(it);
  if(it.kind==='w') return it.th; if(it.kind==='p') return it.a[0]+'／'+it.b[0];
  if(it.kind==='f') return it.show; if(it.kind==='tn') return TONES[it.tone].n; if(it.kind==='tr') return it.text.split('→')[0].trim();
  return '';
}
function nightActive(){ const m=S.settings.night||'auto'; if(m==='on') return true; if(m==='off') return false; const h=hourNow(); return h>=19 || h<5 || !!(run && run.phase==='night'); }

/* =========================================================
   6. 出題
   ========================================================= */
function consOpt(c,neutral){ return {key:c.ch, html:`<span class="t ${neutral?'':'c-'+c.cls}">${c.ch}</span>`}; }
function soundOpt(c){ return {key:c.r||'∅', html:`<span style="font-size:22px;font-weight:700">${c.r||'（不發音）'}</span>`, sub:esc(c.anchor.replace(/（.*?）/g,''))}; }
function distinctSound(c,n,pool){
  const others = shuffle((pool||CONS).filter(x=>x.r!==c.r && x.freq));
  return uniqBy([c].concat(others),x=>x.r).slice(0,n);
}
function memoLine(c){ const m=c.memo; return m?`${m[3]?m[3]+' ':''}<span class="th">${m[0]}</span> ${m[1]}・${m[2]}`:''; }
function consLogic(c){
  const twin = CONS.filter(x=>x.r===c.r && x.cls!==c.cls && x.freq && x.cls!=='mid' && c.cls!=='mid');
  if(c.cls==='high' && twin.length) return `高子音 ${c.ch} 和低子音 ${twin.map(t=>`<span class="c-low th">${t.ch}</span>`).join(' ')} 同音，用顏色區分。`;
  if(c.cls==='low' && twin.length) return `低子音 ${c.ch} 和高子音 ${twin.map(t=>`<span class="c-high th">${t.ch}</span>`).join(' ')} 同音（雙胞胎），用顏色區分。`;
  if(c.cls==='low') return `${c.ch} 是獨立低子音，沒有高子音雙胞胎，用紫色記。`;
  return '中子音用藍色記。口訣：<span class="th">ไก่ จิก เด็ก ตาย บน ปาก โอ่ง</span>（雞啄死了水缸口上的小孩）。';
}
function signNote(c){ return FALSE_FRIEND[c.ch] ? `<div class="note" style="padding:8px 12px">注意：${FALSE_FRIEND[c.ch]}</div>` : ''; }
function nameExplain(c){ return `<span class="th c-${c.cls}">${c.ch}</span> ＝ <b>${c.r||'不發音'}</b>：${esc(c.anchor)}。${CLS[c.cls]}，字母名 <span class="th">${c.ch} ${c.name}</span>（${c.nameZh}）。<br>記憶詞：${memoLine(c)}`; }
function qSeeCons(c){
  return {qt:'see', items:[c.id], cat:'read', prompt:'這個子音念什麼音？', big:`<div class="big c-${c.cls}">${c.ch}</div>`, audio:consSound(c),
    opts:shuffle(distinctSound(c,4)).map(soundOpt), ans:c.r||'∅', explain:nameExplain(c)};
}
function qListenCons(c){
  const pool = learnedCons().length>=4?learnedCons():CONS;
  return {qt:'listen', items:[c.id], cat:'sound', prompt:'聽到的是哪個字母？', big:'', audio:consSound(c), autoplay:true, needsAudio:true,
    opts:shuffle(distinctSound(c,4,pool.concat([c]))).map(x=>consOpt(x,false)), ans:c.ch, explain:nameExplain(c)};
}
function qMemo(c){
  if(!c.memo) return null;
  const others = shuffle(CONS.filter(x=>x.ch!==c.ch && x.freq && x.memo && x.memo[3] && x.r!==c.r)).slice(0,3);
  return {qt:'memo', items:[c.id], cat:'read', prompt:`${c.memo[3]||''} <span class="th">${c.memo[0]}</span>（${c.memo[2]}）是用哪個字母記的？`, big:'', audio:null,
    opts:shuffle([c].concat(others)).map(x=>consOpt(x,true)), ans:c.ch, explain:nameExplain(c)};
}
function qClassify(c){
  return {qt:'classify', items:[c.id], cat:'class', prompt:'這是中、高、還是低子音？', big:`<div class="big">${c.ch}</div>`, audio:null, one:true,
    opts:['mid','high','low'].map(k=>({key:k,html:`<span style="font-size:18px;font-weight:700" class="c-${k}">${CLS[k]}</span>`})),
    ans:c.cls, explain:`<span class="th c-${c.cls}">${c.ch}</span> 是<b class="c-${c.cls}">${CLS[c.cls]}</b>。${consLogic(c)}`};
}
function qShape(c){
  const grp = LOOKALIKE.find(g=>g.includes(c.ch)); if(!grp) return null;
  const members = uniqBy([...grp].map(ch=>CMAP[ch]).filter(Boolean),x=>x.r+x.cls);
  if(members.length<2) return null;
  return {qt:'shape', items:[c.id], cat:'shape', prompt:`哪一個是 <b>${c.r||'不發音的 อ'}</b>（<span class="c-${c.cls}">${CLS[c.cls]}</span>）？`, big:'', audio:null,
    opts:shuffle(members.slice(0,4)).map(x=>consOpt(x,true)), ans:c.ch, explain:members.map(m=>`<span class="th c-${m.cls}" style="font-size:22px">${m.ch}</span> ${m.r||'∅'}（${CLS[m.cls]}）`).join('　')};
}
function qSign(c){
  const others = shuffle(learnedCons().filter(x=>x.ch!==c.ch && x.freq)).slice(0,3);
  if(others.length<2) return null;
  return {qt:'sign', items:[c.id], cat:'sign', prompt:'招牌字體：這是哪一個字母？', big:`<div class="big sign">${c.ch}</div><p class="small muted" style="text-align:center">無頭圈字體（招牌、菜單、包裝）</p>`, audio:null,
    opts:shuffle([c].concat(others)).map(x=>({key:x.ch,html:`<span class="t c-${x.cls}">${x.ch}</span>`,sub:x.r||'∅'})), ans:c.ch,
    explain:`<div class="duo"><div><div class="mid-big c-${c.cls}">${c.ch}</div><div class="lbl">課本／手寫</div></div><div><div class="mid-big sign">${c.ch}</div><div class="lbl">招牌字</div></div></div>${c.r||'不發音'}・${CLS[c.cls]}${FALSE_FRIEND[c.ch]?'<br><b>'+FALSE_FRIEND[c.ch]+'</b>':''}`};
}
function vLenTxt(v){ return v.len==='L'?'長音':v.len==='S'?'短音':'不配對母音'; }
function qSeeVowel(v){
  let others = []; if(v.pair) others.push(VMAP[v.pair]);
  others = others.concat(shuffle(VOWELS.filter(x=>x.id!==v.id && (x.len===v.len || x.len==='U'))));
  return {qt:'see', items:[v.id], cat:v.len==='U'?'read':'length', prompt:'這個母音念什麼？', big:`<div class="big c-vowel">${vForm(v)}</div>`, audio:vSay(v),
    opts:shuffle(uniqBy([v].concat(others),x=>x.r).slice(0,4)).map(x=>({key:x.r,html:`<span style="font-size:22px;font-weight:700">${x.r}</span>`,sub:x.len==='L'?'長':x.len==='S'?'短':'不配對'})),
    ans:v.r, explain:`<span class="th">${vForm(v)}</span> ＝ <b>${v.r}</b>（${vLenTxt(v)}）。${esc(fixMarks(v.logic))}`};
}
function qListenVowel(v){
  let others = []; if(v.pair) others.push(VMAP[v.pair]);
  others = others.concat(shuffle(VOWELS.filter(x=>x.id!==v.id && lvl(x.id)>=1)), shuffle(VOWELS.filter(x=>x.id!==v.id)));
  const list = shuffle(uniqBy([v].concat(others),x=>x.r+x.len).slice(0,4));
  return {qt:'listen', items:[v.id], cat:'length', prompt:'聽到的是哪一個母音？', big:'', audio:vSay(v), autoplay:true, needsAudio:true,
    opts:list.map(x=>({key:x.id,html:`<span class="t">${vForm(x)}</span>`})), ans:v.id, explain:`<span class="th">${vForm(v)}</span> ${v.r}（${vLenTxt(v)}）。${esc(fixMarks(v.logic))}`};
}
const finalOpts = f => shuffle(uniqBy([f].concat(shuffle(FINALS.filter(x=>x.id!==f.id))),x=>x.id).slice(0,4)).map(x=>({key:x.id,html:`<span style="font-size:22px;font-weight:700">${x.show}</span>`,sub:x.live?'活音':'死音'}));
function finalExplain(f){ return `尾音 <b>${f.show}</b>（${f.live?'活音，可以拉長':'死音，會截斷'}）：<span class="th">${f.letters.filter(ch=>CMAP[ch].freq).join(' ')}</span><br>例：${f.ex[3]} <span class="th">${f.ex[0]}</span> ${f.ex[1]}・${f.ex[2]}`; }
function qFinalLetter(f){
  const ch = pick(f.letters.filter(x=>CMAP[x].freq));
  return {qt:'final', items:[f.id], cat:'final', prompt:`<span class="th" style="font-size:28px">${ch}</span> 放在字尾時，念什麼音？`, big:'', audio:null, opts:finalOpts(f), ans:f.id, explain:finalExplain(f)};
}
function qFinalWord(f){
  const w=f.ex[0], last=[...w].reverse().find(ch=>CMAP[ch]);
  const html = w.replace(new RegExp(last+'(?!.*'+last+')'),`<span class="c-tone">${last}</span>`);

}

function sylForRule(rid){
  const cls = rid.includes('mid')?'mid':rid.includes('high')?'high':rid.includes('low')?'low':pick(['mid','high','low']);
  const cs = CONS.filter(c=>c.cls===cls && c.freq && c.ch!=='อ');
  const c = pick(cs);
  if(rid.endsWith('-live')){ const v=pick(availVowels().filter(v=>v.len!=='S')); return makeSyl(c,v,''); }
  if(rid==='tr:mid-dead'||rid==='tr:high-dead'||rid==='tr:low-dead-s'){ const v=pick(learnedVowels().filter(v=>v.len==='S')) || VMAP['v:a-s']; return makeSyl(c,v,''); }
  if(rid.startsWith('tr:mark')){ const v=pick(availVowels().filter(v=>v.len!=='S')); const t=pick(toneMarksFor(c,v).filter(Boolean)); return makeSyl(c,v,t); }
  if(rid==='tr:mix'){ const v=pick(availVowels()); return makeSyl(c,v,pick(toneMarksFor(c,v))); }
  return null;
}
function wordForRule(rid){
  const ws = rid==='tr:mix' ? TWORDS : TWORDS.filter(w=>ruleOf(w.cls,w.kind,w.mark)===rid);
  return ws.length?pick(ws):null;
}
function qReason(rid,useWord){
  const w = useWord ? wordForRule(rid) : sylForRule(rid);
  if(!w) return null;
  const steps = [
    {q:'1　起首子音是哪一類？',opts:['mid','high','low'].map(k=>({key:k,txt:CLS[k]})),ans:w.cls},
    {q:'2　活音還是死音？',opts:Object.entries(KIND).map(([k,t])=>({key:k,txt:t})),ans:w.kind},
    {q:'3　聲調符號？',opts:['','่','้','๊','๋'].map(k=>({key:k,txt:TM[k]})),ans:w.mark},
    {q:'4　所以念什麼聲調？',opts:['M','L','F','H','R'].map(k=>({key:k,txt:TONES[k].n})),ans:w.tone}
  ];
  const item = rid==='tr:mix' ? 'tr:mix' : ruleOf(w.cls,w.kind,w.mark);
  return {qt:'reason', kind:'reason', w, steps, items:[item]};
}
function qSpell(rid){
  const s = sylForRule(rid); if(!s || !s.c) return null;
  const sameSound = CONS.filter(x=>x.r===s.c.r && x.ch!==s.c.ch && x.freq);
  const consPool = uniqBy([s.c].concat(shuffle(sameSound),shuffle(CONS.filter(x=>x.freq && x.ch!=='อ'))),x=>x.ch).slice(0,4);
  const vPool = uniqBy([s.v].concat(shuffle(availVowels())),x=>x.id).slice(0,4);
  return {qt:'spell', kind:'spell', syl:s, cons:shuffle(consPool), vows:shuffle(vPool), marks:['','่','้','๊','๋'], items:[rid==='tr:mix'?'tr:mix':ruleOf(s.cls,s.kind,s.mark)]};
}

function questionFor(id, opts={}){
  const it = ITEM[id]; if(!it) return null;
  let gens = [];
  if(it.kind==='c'){
    gens = [()=>qSeeCons(it),()=>qListenCons(it),()=>qClassify(it),()=>qShape(it),()=>qMemo(it)];
    if(lvl(id)>=2) gens.push(()=>qSign(it));
  } else if(it.kind==='v'){ gens = [()=>qSeeVowel(it),()=>qListenVowel(it)]; }
  else if(it.kind==='f'){ gens = [()=>qFinalLetter(it),()=>qFinalWord(it),()=>qFinalLive(it)]; }
  else if(it.kind==='tn'){ gens = [()=>qToneListen(it.tone),()=>qToneRoman(it.tone)]; }
  else if(it.kind==='tr'){
    gens = [()=>qReason(id,true)];
    if(!opts.noReason){ gens.push(()=>qReason(id,false)); if(id.startsWith('tr:mark')||id==='tr:mix') gens.push(()=>qSpell(id)); }
  }
  else if(it.kind==='p'){ gens=[()=>qPair(it)]; }
  else if(it.kind==='w'){ gens = opts.noReason ? [()=>qVocabListen(it)] : [()=>qVocabListen(it),()=>genDrill(it.stage),()=>genDrill(it.stage)]; }
  const s = S.items[id];
  for(const g of shuffle(gens)){ const q=g(); if(q && (!s || !s.okTypes.includes(q.qt) || Math.random()<0.4)) return q; }
  for(const g of shuffle(gens)){ const q=g(); if(q) return q; }
  return null;
}

   7. 每日循環：睡前學、隔天考
   ========================================================= */
function nightStep(){
  const d = dayRec();
  if(!d.relearnDone && d.testWrong.length) return {k:'relearn',label:`錯題重學（${Math.min(6,d.testWrong.length)} 題）`};
  if((d.night||0) < 25*60) return {k:'learn',label: reviewOnlyTonight()?'今晚只複習（昨晚沒學）':'學新內容（約 5 分鐘）'};
  if(!d.recallDone) return {k:'recall',label:'睡前回想（約 5 分鐘）'};
  return {k:'learn',label:'再學一輪（約 5 分鐘）'};
}
function testPlan(){
  const today=dayKey(), d=dayRec(), ln=lastStudyNight(), tested=new Set(d.tested);
  const lnRec = ln ? S.days[ln] : null;
  const A = uniqBy(Object.keys(S.items).filter(id=>ITEM[id] && S.items[id].introDay && S.items[id].introDay===ln && isIntro(id))
              .concat(lnRec&&lnRec.relearnIds?lnRec.relearnIds:[]), x=>x).filter(id=>ITEM[id] && !tested.has(id));
  const sk = S.skipped.filter(id=>ITEM[id] && !tested.has(id) && S.items[id] && S.items[id].introDay && S.items[id].introDay<today);
  const B = dueIds().filter(id=>S.items[id].introDay && S.items[id].introDay<today && !tested.has(id) && !A.includes(id) && !sk.includes(id));
  return {A,B,sk,ln};
}
const hasContent = line => !!currentStage(line) || newQueue(line).length>0;
function buildNight(kind){
  const d=dayRec(), steps=[];
  const addQ=(id,o)=>{ const q=questionFor(id,o); if(q) steps.push(q); };
  if(kind==='relearn'){
    d.testWrong.slice(0,6).forEach(id=>{ steps.push({kind:'intro',id,relearn:true}); addQ(id,{noReason:true}); });
    return steps;
  }
  if(kind==='recall'){
    const ok = id => ITEM[id] && ['c','v','w','f'].includes(ITEM[id].kind) && ITEM[id].stage!=='X';
    let ids = uniqBy(d.newIds.concat(d.relearnIds),x=>x).filter(ok);
    if(!ids.length) ids = Object.keys(S.items).filter(id=>ok(id) && S.items[id].introDay>=addDays(dayKey(),-2));
    if(!ids.length) ids = shuffle(learnedIds(it=>['c','v','w','f'].includes(it.kind))).slice(0,8);
    return ids.length?[{kind:'recall',ids:ids.slice(0,12)}]:[];
  }
  if(reviewOnlyTonight()){
    let ids = dueIds(); if(ids.length<8) ids = ids.concat(shuffle(learnedIds().filter(i=>!ids.includes(i))).sort((a,b)=>lvl(a)-lvl(b)));
    shuffle(ids.slice(0,10)).forEach(id=>addQ(id));
    return steps;
  }
  // 新內容：字母、聲調、會話三條線輪流
  const lines = ['L','T','C'].filter(hasContent);
  if(!lines.length){ dueIds().slice(0,10).forEach(id=>addQ(id)); return steps; }
  const line = lines[d.rounds % lines.length];
  const q0 = newQueue(line);
  const sid0 = q0.length ? ITEM[q0[0]].stage : (currentStage(line)||{}).id;
  const k0 = q0.length ? ITEM[q0[0]].kind : '';
  const size = k0==='c'?4:k0==='w'?4:3;
  const fresh = q0.filter(id=>ITEM[id].stage===sid0).slice(0,size);
  if(sid0 && (line==='L'||line==='T') && !sx(sid0).mapSeen) steps.push({kind:'map',stage:sid0});
  if(sid0 && line==='C' && !sx(sid0).introSeen) steps.push({kind:'stageintro',stage:sid0});
  fresh.forEach(id=>steps.push({kind:'intro',id}));
  fresh.forEach(id=>addQ(id,{noReason:true}));
  fresh.forEach(id=>addQ(id));
  const cur = currentStage(line);
  if(cur){
    const pool = shuffle(stageItems(cur.id).filter(i=>isIntro(i) && !fresh.includes(i))).sort((a,b)=>lvl(a)-lvl(b));
    pool.slice(0, Math.max(3, 9-steps.filter(s=>s.qt).length)).forEach(id=>addQ(id));
    if(line==='C'){ for(let i=0;i<2;i++){ const q=genDrill(cur.id); if(q) steps.push(q); } }
  }
  return steps;
}
function buildDayTest(){
  const {A,B,sk} = testPlan();
  const nB = Math.min(B.length, Math.max(4, 12-A.length-sk.length));
  const ids = sk.slice(0,3).concat(A.slice(0,12-Math.min(nB,4)-Math.min(sk.length,3)), shuffle(B).slice(0,nB)).slice(0,12);
  const steps=[]; shuffle(ids).forEach(id=>{ const q=questionFor(id); if(q) steps.push(q); });
  return steps;
}
function buildStageTest(sid){
  const items = stageItems(sid).filter(i=>ITEM[i] && ITEM[i].th!=='Alvis'); const steps=[];
  if(SMAP[sid].line==='C'){
    for(let i=0;i<12;i++){ const q=genDrill(sid); if(q) steps.push(q); }
    shuffle(items).slice(0,6).forEach(id=>steps.push(qVocabListen(ITEM[id])));
  } else {
    const order = shuffle(items);
    for(let i=0;i<20;i++){ const q=questionFor(order[i%order.length]); if(q) steps.push(q); }
  }
  return shuffle(steps);
}
function buildDiag(){
  const steps=[];
  ['S1','S2','S3','S4','S5','S6'].forEach(sid=>{
    steps.push({kind:'diagsection',stage:sid});
    shuffle(stageItems(sid)).forEach(id=>{
      const it=ITEM[id];
      if(it.kind==='c'){
        const sameSound = CONS.filter(x=>x.r===it.r && x.cls!==it.cls);
        const other = distinctSound(it,3).slice(1);
        const combos = uniqBy([{c:it,cls:it.cls}].concat(sameSound.map(x=>({c:it,cls:x.cls})), other.map(x=>({c:x,cls:it.cls})), other.map(x=>({c:x,cls:x.cls}))),x=>x.c.r+x.cls).slice(0,4);
        steps.push({qt:'diag',items:[id],cat:'class',diag:sid,prompt:'這個子音念什麼、屬於哪一類？',big:`<div class="big">${it.ch}</div>`,audio:null,one:true,
          opts:shuffle(combos).map(x=>({key:x.c.r+'|'+x.cls,html:`<span style="font-size:18px;font-weight:700">${x.c.r||'不發音'}・<span class="c-${x.cls}">${CLS[x.cls]}</span></span>`})),
          ans:it.r+'|'+it.cls,explain:nameExplain(it)});
      } else { const q=qSeeVowel(it); q.qt='diag'; q.diag=sid; steps.push(q); }
    });
  });
  return steps;
}

function startNight(kind){
  const steps = buildNight(kind);
  if(!steps.length) return go({name:'home'});
  run = {mode:'night',kind,phase:'night',steps,i:0,right:0,total:0,qStart:Date.now()};
  go({name:'run'});
}
function startDayTest(){
  const steps = buildDayTest();
  if(!steps.length) return go({name:'home'});
  run = {mode:'test',phase:'test',steps,i:0,right:0,total:0,qStart:Date.now()};
  go({name:'run'});
}
function startStageTest(sid){
  run = {mode:'stagetest',stage:sid,steps:buildStageTest(sid),i:0,right:0,total:0,qStart:Date.now(),phase:'test'};
  go({name:'run'});
}
function addTime(){
  if(!run) return;
  const sec = Math.min(90,Math.round((Date.now()-(run.qStart||Date.now()))/1000));
  const d = dayRec(); d[run.phase] = (d[run.phase]||0) + sec;
  run.qStart = Date.now();
}
function header(){
  const n=run.steps.length, i=run.i;
  const title = run.mode==='stagetest'?`${SMAP[run.stage].name}・階段考`:run.mode==='diag'?'程度診斷':run.mode==='test'?'今天考試':
    ({relearn:'今晚・錯題重學',learn:'今晚・學習',recall:'今晚・睡前回想'})[run.kind]||'今晚';
  return `<div class="qhead"><button class="linkbtn" id="quit" aria-label="回首頁">✕ 離開</button><div class="progress"><i style="width:${Math.round(i/n*100)}%"></i></div><span class="small muted">${Math.min(i+1,n)} / ${n}</span></div>
  <div class="row between"><span class="small muted">${title}</span><button class="pill ${quiet()?'on':''}" id="qtr" aria-pressed="${quiet()}">安靜：${quiet()?'開':'關'}</button></div>`;
}
function bindQuit(){
  const b=document.getElementById('quit'); if(b) b.onclick=()=>{ addTime(); touch(); run=null; go({name:'home'}); };
  const q=document.getElementById('qtr'); if(q) q.onclick=()=>{ S.settings.quiet=!quiet(); touch(); q.classList.toggle('on',quiet()); q.textContent='安靜：'+(quiet()?'開':'關'); q.setAttribute('aria-pressed',quiet()); };
}
function next(){ addTime(); run.i++; touch(); render(); window.scrollTo(0,0); }
function skipQ(q){ (q.items||[]).forEach(id=>{ if(!S.skipped.includes(id)) S.skipped.push(id); }); next(); }
function renderRun(){
  if(!run) return go({name:'home'});
  if(run.i>=run.steps.length) return renderDone();
  const q = run.steps[run.i];
  if(q.kind==='intro') return renderIntro(q);
  if(q.kind==='map') return renderMap(q.stage,true);
  if(q.kind==='stageintro') return renderStageIntro(q);
  if(q.kind==='diagsection') return renderDiagSection(q);
  if(q.kind==='recall') return renderRecall(q);
  if(q.kind==='reason') return renderReason(q);
  if(q.kind==='spell') return renderSpell(q);
  if(q.kind==='drill') return renderDrill(q);
  return renderChoice(q);
}

function grade(q,ok){
  run.total++; if(ok) run.right++;
  if(run.mode==='diag'){
    const id=q.items[0];
    run.score[q.diag]=run.score[q.diag]||{r:0,n:0}; run.score[q.diag].n++; if(ok) run.score[q.diag].r++;
    if(ok){ const s=st(id); s.l=2; s.step=2; s.seen=1; s.okDays=[dayKey()]; s.okTypes=['diag','see']; s.lastOk=dayKey(); s.due=addDays(dayKey(),3); s.introDay='2000-01-01'; }
    return;
  }
  q.items.forEach(id=>record(id,ok,q.qt,q.cat));
}
function feedback(ok,explain,audio){
  const fb=document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok?'good':'bad'}"><span class="ttl">${ok?pick(['答對了！','沒錯！','很好！','正確！']):'差一點，看一下邏輯'}</span><div>${explain||''}</div></div>`;
  const nx=document.getElementById('nx');

  if(audio) document.getElementById('ag').onclick=()=>say(audio);
  document.getElementById('nb').onclick=next;

}

function renderReason(q){
  const w=q.w, st0 = q.state || (q.state={k:0,res:[]});
  const showStep = i => {
    const step=q.steps[i], r=st0.res[i]; if(r===undefined) return '';
    const optTxt = step.opts.find(o=>o.key===step.ans).txt;
    return `<div class="step ${r.ok?'ok':'no'}"><span class="n">${i+1}</span><span>${step.q.slice(3)}</span><span class="v">${r.ok?optTxt:`你選 ${step.opts.find(o=>o.key===r.k).txt}<br><span class="small">應為 ${optTxt}</span>`}</span></div>`;
  };
  const cur = q.steps[st0.k];
  $app.innerHTML = `${header()}
  <h2>推理題：這個字念什麼聲調？</h2>
  <div class="card" style="align-items:center"><div class="big">${w.th}</div><span class="small muted">${w.practice?'練習音節（不是真實單字，不播放聲音）':esc(w.zh)}</span></div>
  <div class="steps">${q.steps.map((_,i)=>showStep(i)).join('')}</div>
  ${cur?`<h3>${cur.q}</h3><div class="opts ${cur.opts.length>3?'':'one'}">${cur.opts.map(o=>`<button class="opt" data-k="${esc(o.key)}"><span style="font-size:16px;font-weight:700">${o.txt}</span></button>`).join('')}</div>`:''}
  <div id="fb"></div><div class="spacer"></div><div id="nx"></div>`;
  bindQuit();
  if(cur){
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ st0.res[st0.k]={k:b.dataset.k,ok:b.dataset.k===cur.ans}; st0.k++; renderReason(q); });
  } else {
    const allOk = st0.res.every(r=>r.ok), firstBad = st0.res.findIndex(r=>!r.ok);
    if(!q.graded){
      q.graded=true; run.total++; if(allOk) run.right++;
      const cat = !st0.res[0].ok?'class':!st0.res[1].ok?'length':'tone';
      if(run.mode!=='diag') q.items.forEach(id=>record(id,allOk,'reason',cat));
    }
    feedback(allOk, `${allOk?'':`邏輯斷在第 ${firstBad+1} 步。<br>`}<span class="th" style="font-size:22px">${w.th}</span> ＝ <b>${w.r}</b> ${curve(w.tone)}<br>${explainRule(w)}`, w.practice?null:w.th);
  }
}

function wordRoman(t){ const w=WMAP[t]; return w?w.r:''; }

  }
  if(!q.bank){
    const ans=q.answers[0];
    const topic=(ITEM[q.items[0]]||{stage:'C1'}).stage;
    const distract = shuffle(VOCAB.filter(w=>w.stage===topic && !ans.includes(w.th))).slice(0,2).map(w=>w.th);

  const modelHtml = q.heard ? `<div class="row">${audioBtn(q.heard,true)}<div class="col" style="gap:0"><span class="small muted">對方說</span><span class="th" style="font-size:20px">${q.done?esc(q.heard):'（點喇叭聽）'}</span></div></div>`
    : `<div class="row" style="flex-wrap:wrap"><span class="small muted">原句</span><span class="th" style="font-size:24px;font-weight:600">${esc(q.model.join(''))}</span>${audioBtn(q.model.join(''))}</div>`;
  $app.innerHTML = `${header()}
  <span class="pill" style="align-self:flex-start">${DT[q.dtype]}</span>
  <h2>${esc(q.instr)}</h2>
  <div class="card">${modelHtml}<div class="row"><span class="small muted">提示</span><span style="font-size:18px;font-weight:700">${esc(q.cue)}</span></div></div>
  <p class="small muted">先在心裡說一次，再排字卡。拼音模糊的字代表你已認得它的所有子音，點一下可看。</p>
  <div class="answer tiles">${q.sel.map(i=>tile(q.bank[i],'ans')).join('')}</div>
  <div class="tiles">${q.bank.map(b=>tile(b,'bank')).join('')}</div>
  <div id="fb"></div><div class="spacer"></div><div id="nx">${q.done?'':`<button class="btn primary" id="chk" ${q.sel.length?'':'disabled'}>檢查</button>`}</div>`;
  bindQuit(); bindAudio();
  if(q.heard && !q.played && (!quiet()||q.unlocked)){ q.played=true; setTimeout(()=>say(q.heard),250); }
  $app.querySelectorAll('.hide-roman').forEach(el=>el.onclick=e=>{ e.stopPropagation(); el.classList.remove('hide-roman'); });
  if(q.done) return;
  $app.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{ const it=q.bank[+b.dataset.bank]; if(it.used) return; it.used=true; q.sel.push(it.i); renderDrill(q); });
  $app.querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.ans; q.bank[i].used=false; q.sel=q.sel.filter(x=>x!==i); renderDrill(q); });
  document.getElementById('chk').onclick=()=>{
    const mine = q.sel.map(i=>q.bank[i].t);
    const ok = q.answers.some(a=>a.length===mine.length && a.every((t,i)=>t===mine[i]));
    const sameSet = q.answers.some(a=>a.length===mine.length && [...a].sort().join()===[...mine].sort().join());
    q.done=true; renderDrill(q);
    run.total++; if(ok) run.right++;
    q.items.forEach(id=>record(id, ok, 'drill', sameSet?'order':'vocab'));
    const a = q.answers[0], sentence = a.join('');
    feedback(ok, `<span class="th" style="font-size:22px">${esc(sentence)}</span><br>${a.map(t=>`${esc(t)} ${esc(wordRoman(t))}`).join('・')}${!ok&&sameSet?'<br>字都對了，順序要再調整：泰語修飾語放在後面。':''}`, sentence.replace('Alvis',' Alvis '));
  };
}

/* ---------- 一輪結束 ---------- */
function renderDone(){
  addTime();
  const d=dayRec(); let title='這一輪完成', body='', extra='';
  const pct = run.total?Math.round(run.right/run.total*100):100;
  if(run.mode==='night'){
    if(run.kind==='relearn'){ d.relearnDone=true; title='錯題重學完成'; }
    else if(run.kind==='recall'){ title='今晚完成，晚安'; body='明天早上或中午記得來考試。'; }
    else { d.rounds++; }
    if(run.total) body = `答對 ${run.right} / ${run.total}（${pct}%）`;
    const ready = STAGES.filter(s=>stageOpen(s.id) && !stagePassed(s.id) && testReady(s.id));
    if(ready.length) extra = `<div class="note">${ready.map(s=>`「${s.name}」`).join('、')}的內容都熟悉了，可以參加階段考。</div>`;
    if(run.kind!=='recall') extra += `<p class="small muted">今晚已學 ${Math.round(d.night/60)} / 30 分。${(d.night||0)>=25*60&&!d.recallDone?'最後做一次睡前回想就完成了。':''}</p>`;
  }
  if(run.mode==='test'){
    d.testRight += run.right; d.testTotal += run.total; d.testDone = true;
    title='今天考試完成';
    body = `答對 ${run.right} / ${run.total}（${pct}%）`;
    extra = d.testWrong.length ? `<div class="note">答錯的 ${d.testWrong.length} 項，今晚會先重學。</div>` : '<div class="note">全部答對，昨晚學的已經升到「熟悉」。</div>';
  }
  if(run.mode==='stagetest'){
    const pass = pct>=80, sid=run.stage;
    const before = new Set(openStages().map(s=>s.id));
    sx(sid).best=Math.max(sx(sid).best||0,pct);
    if(pass) sx(sid).passed=true;
    const opened = openStages().filter(s=>!before.has(s.id));
    title = pass?`「${SMAP[sid].name}」過關！`:`「${SMAP[sid].name}」還差一點`;
    body = `答對 ${run.right} / ${run.total}（${pct}%）。過關標準 80%。`;
    extra = pass ? (opened.length?`<div class="note">已解鎖${opened.map(s=>`「${LINES[s.line]}・${s.name}」`).join('、')}。</div>`:'')
                 : `<div class="note">錯的題目今晚重學。明天可以再考，題目會重新組合。</div>`;
  }
  if(run.mode==='diag'){
    S.onboarded=true; title='診斷完成';
    body = Object.entries(run.score).map(([sid,v])=>{
      const p=Math.round(v.r/v.n*100), pass=p>=80;
      if(pass) Object.assign(sx(sid),{passed:true,introSeen:true,mapSeen:true});
      return `<div class="row between"><span>${SMAP[sid].name}</span><span style="font-weight:700">${p}%${pass?'・跳過':'・會再教'}</span></div>`;
    }).join('') || '你略過了全部，App 會從中子音開始教。';
    extra = '<p class="small muted">答對的字母已標成「熟悉」，答錯的會重新介紹。</p>';
  }
  touch();
  $app.innerHTML = `<div class="card" style="align-items:center;text-align:center"><h1>${title}</h1><div style="width:100%">${body}</div></div>${extra}
  <div class="spacer"></div><button class="btn primary" id="home">回首頁</button>`;
  document.getElementById('home').onclick=()=>{ run=null; go({name:'home'}); };
}

/* ---------- 手寫描寫（子音與母音） ---------- */
let traceBack = {name:'home'};
function renderTrace(){
  const text=route.text, cls=route.cls||'vowel';
  $app.innerHTML = `<div class="row between"><button class="linkbtn" id="back">← 返回</button><h2>描寫 <span class="th c-${cls}">${esc(text)}</span></h2>${audioBtn(route.say)}</div>
  <p class="small muted">${cls==='vowel'?'母音用 อ 當底字：注意母音寫在 อ 的上、下、前、後哪個位置。':'從頭圈（小圓圈）起筆，沿著淡色字形描。'}完成後會疊上標準字形讓你比對。描寫只練課本字體。</p>
  <canvas class="trace" id="cv" width="640" height="640" aria-label="描寫區"></canvas>
  <div id="fb"></div>
  <div class="btns"><button class="btn" id="clr">清除重寫</button><button class="btn primary" id="cmp">完成，比對</button></div>
  <button class="btn ghost" id="done">回去</button>`;
  bindAudio();
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const css = getComputedStyle(document.body);
  const col = css.getPropertyValue('--'+cls).trim(), soft=css.getPropertyValue('--soft').trim(), fg=css.getPropertyValue('--fg').trim();
  let strokes=[], cur=null, compared=false;
  const drawGuide = strong => {
    ctx.clearRect(0,0,640,640);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    let size=440; ctx.font = `600 ${size}px "Noto Sans Thai Looped",Tahoma,sans-serif`;
    const w=ctx.measureText(text).width; if(w>560){ size=Math.floor(size*560/w); ctx.font = `600 ${size}px "Noto Sans Thai Looped",Tahoma,sans-serif`; }
    ctx.fillStyle = strong?col:soft; ctx.globalAlpha = strong?0.35:1;
    ctx.fillText(text,320,340); ctx.globalAlpha=1;
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=size>300?22:16; ctx.strokeStyle=strong?fg:col;
    strokes.forEach(s=>{ ctx.beginPath(); s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke(); });
  };
  const pos = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*640,(e.clientY-r.top)/r.height*640]; };
  cv.onpointerdown = e => { if(compared) return; cv.setPointerCapture(e.pointerId); cur=[pos(e)]; strokes.push(cur); drawGuide(false); };
  cv.onpointermove = e => { if(!cur) return; cur.push(pos(e)); drawGuide(false); };
  cv.onpointerup = cv.onpointercancel = () => { cur=null; };
  const ready = () => drawGuide(false);
  try{ document.fonts.load('600 40px "Noto Sans Thai Looped"').then(ready,ready); }catch(e){}
  ready();
  document.getElementById('clr').onclick=()=>{ strokes=[]; compared=false; document.getElementById('fb').innerHTML=''; drawGuide(false); };
  document.getElementById('cmp').onclick=()=>{
    compared=true; drawGuide(true);
    document.getElementById('fb').innerHTML = `<div class="fb good"><span class="ttl">比對看看</span><div>彩色是標準字形，深色是你寫的。位置和方向對了嗎？手機無法自動評分，請自己判斷，不像就清除重寫。</div></div>`;
  };
  const back=()=>go(traceBack);
  document.getElementById('back').onclick=back; document.getElementById('done').onclick=back;
}

/* ---------- 聲調規則表 ---------- */
function renderRules(){
  const row=(cls,a,b,c,d,e,f)=>`<tr><td class="c-${cls}" style="font-weight:700">${CLS[cls]}</td><td>${a}</td><td>${b}</td><td>${c}</td><td>${d}</td><td>${e}</td><td>${f}</td></tr>`;
  $app.innerHTML = `<div class="row between"><button class="linkbtn" id="back">← 首頁</button><h2>聲調規則表</h2><span></span></div>
  <p class="small muted">推算順序：子音類別 → 活音或死音 → 聲調符號 → 聲調。</p>
  <div class="card" style="overflow-x:auto"><table class="rules">
  <tr><th></th><th>活音</th><th>死音</th><th class="c-tone">่</th><th class="c-tone">้</th><th class="c-tone">๊</th><th class="c-tone">๋</th></tr>
  ${row('mid','中平','低','低','降','高','升')}
  ${row('high','升','低','低','降','—','—')}
  ${row('low','中平','短：高<br>長：降','降','高','—','—')}
  </table></div>
  <div class="card"><h3>五個聲調</h3>${Object.entries(TONES).map(([k,t])=>`<div class="row">${curve(k)}<span style="font-weight:700;min-width:56px">${t.n}</span><span class="small muted">${t.hint}</span></div>`).join('')}
  <p class="small muted">拼音符號：a 中平、à 低、â 降、á 高、ǎ 升</p></div>
  <div class="card"><h3>活音與死音</h3><p>能拉長唱下去的是<b>活音</b>：長母音結尾，或尾音 m、n、ng、y、w，以及不配對母音。<br>會被截斷的是<b>死音</b>：短母音結尾，或尾音 k、t、p。</p></div>`;
  document.getElementById('back').onclick=()=>go({name:'home'});
}

/* ---------- 設定 ---------- */
function renderSettings(){
  loadVoice();
  const nm = S.settings.night||'auto';
  $app.innerHTML = `<div class="row between"><button class="linkbtn" id="back">← 首頁</button><h2>語音與設定</h2><span></span></div>
  <div class="card"><h3>語音檢查</h3>
    <p>${!TTS_OK?'這個畫面不支援語音播放。':thaiVoice?`已找到泰文語音：${esc(thaiVoice.name)}`:'還沒找到泰文語音。'}</p>
    ${!TTS_OK?`<div class="note">${ttsHelp()}</div>`:''}
    <button class="btn" id="test">播放 <span class="th">สวัสดีครับ</span></button>
    ${TTS_OK&&!thaiVoice?`<div class="note">Android：設定 → 系統 → 語言 → 文字轉語音輸出 → 偏好的引擎選「Google 語音服務」→ 下載「泰文」語音資料。完成後重新開啟這個頁面。</div>`:''}
  </div>
  <div class="card"><h3>夜間模式</h3><p class="small muted">暖色暗底、降低藍光。「自動」在晚上 7 點到清晨 5 點，以及做今晚學習時開啟。</p>
    <div class="seg">${[['auto','自動'],['on','永遠開'],['off','關閉']].map(([k,t])=>`<button class="pill ${nm===k?'on':''}" data-night="${k}">${t}</button>`).join('')}</div></div>
  <div class="card"><h3>安靜模式</h3><p class="small muted">在公共場合考試時開啟：不自動播放聲音，要聽的題目可以戴耳機作答或先略過，略過不算錯。</p>
    <button class="pill ${quiet()?'on':''}" id="qt" style="align-self:flex-start">安靜模式：${quiet()?'開':'關'}</button></div>
  <div class="card"><h3>語速</h3>
    <div class="row"><input type="range" id="rate" min="0.5" max="1.1" step="0.1" value="${S.settings.rate||0.8}" style="flex:1" aria-label="語速"><span id="rv">${S.settings.rate||0.8}</span></div>
    <p class="small muted">夜間會自動再放慢一點。</p></div>
  <div class="card"><h3>備份進度</h3><p class="small muted">進度只存在這支手機。換手機、清除瀏覽器資料前，先匯出備份；新手機上再匯入。${S.lastBackup?`上次備份：${S.lastBackup}`:'還沒備份過。'}</p>
    <div class="btns"><button class="btn" id="exp">匯出備份</button><button class="btn" id="imp">匯入備份</button></div>
    <input type="file" id="impfile" accept="application/json,.json" hidden>
    <div id="impmsg"></div></div>
  <div class="card"><h3>安裝到主畫面</h3><p class="small">用 Chrome 開啟 → 右上角選單 → 「安裝應用程式」或「加到主畫面」。安裝後沒有網路也能練習。</p></div>
  <div class="card"><h3>重新診斷</h3><p class="small muted">保留現有進度，再做一次程度診斷。</p><button class="btn" id="rediag">重新診斷</button></div>
  <div class="card"><h3>全部重設</h3><p class="small muted">清除所有學習紀錄，無法復原。</p><button class="btn" id="reset">清除所有進度</button><div id="cf"></div></div>
  <p class="small muted">版本 ${APP_VERSION}</p>`;
  document.getElementById('back').onclick=()=>go({name:'home'});
  document.getElementById('test').onclick=()=>say('สวัสดีครับ');
  document.getElementById('exp').onclick=()=>{ exportProgress(); document.getElementById('impmsg').innerHTML='<p class="small">已匯出，檔案在手機的「下載」資料夾。</p>'; };
  const fi=document.getElementById('impfile');
  document.getElementById('imp').onclick=()=>fi.click();
  fi.onchange=()=>{ const f=fi.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ importProgress(JSON.parse(rd.result)); document.getElementById('impmsg').innerHTML='<p class="small">匯入完成。</p>'; }catch(e){ document.getElementById('impmsg').innerHTML='<div class="note">這個檔案不是這個 App 的備份，請選擇 thai-progress 開頭的檔案。</div>'; } };
    rd.readAsText(f); };
  $app.querySelectorAll('[data-night]').forEach(b=>b.onclick=()=>{ S.settings.night=b.dataset.night; touch(); render(); });
  document.getElementById('qt').onclick=()=>{ S.settings.quiet=!quiet(); touch(); render(); };
  const r=document.getElementById('rate'); r.oninput=()=>{ S.settings.rate=+r.value; document.getElementById('rv').textContent=r.value; touch(); };
  document.getElementById('rediag').onclick=()=>{ run={mode:'diag',steps:buildDiag(),i:0,score:{},right:0,total:0,qStart:Date.now(),phase:'night'}; go({name:'run'}); };
  document.getElementById('reset').onclick=()=>{
    document.getElementById('cf').innerHTML=`<p class="small">確定要清除？</p><div class="btns"><button class="btn" id="no">取消</button><button class="btn primary" id="yes">確定清除</button></div>`;
    document.getElementById('no').onclick=()=>document.getElementById('cf').innerHTML='';
    document.getElementById('yes').onclick=()=>{ S=S0(); touch(); go({name:'welcome'}); };
  };
}

/* =========================================================
   9. 啟動
   ========================================================= */
(function boot(){
  const local = loadLocal();
  if(local) S = normalize(local);
  render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && run){ addTime(); touch(); } else if(run) run.qStart=Date.now(); });
  setInterval(()=>{ if(route.name==='home') document.body.classList.toggle('night', nightActive()); },60000);
})();

</script>
</body>
